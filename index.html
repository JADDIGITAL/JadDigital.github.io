
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jad Digital - منتجات رقمية</title>
<style>
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  header {
    padding: 40px 20px 20px;
  }
  h1 {
    color: #00ffd5;
    font-size: 3em;
    margin-bottom: 0;
  }
  .products {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
  }
  .product-card {
    background: #1b2a38;
    border-radius: 12px;
    width: 300px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .product-card img {
    max-width: 100%;
    border-radius: 10px;
  }
  .product-title {
    margin: 15px 0 10px;
    font-size: 1.3em;
    font-weight: bold;
  }
  .product-desc {
    font-size: 1em;
    color: #aad4d8;
    min-height: 60px;
  }
  .buy-button {
    margin-top: auto;
    padding: 12px 30px;
    background-color: #00c9a7;
    color: white;
    font-weight: bold;
    text-decoration: none;
    border-radius: 30px;
    transition: background-color 0.3s;
  }
  .buy-button:hover {
    background-color: #009f86;
  }
  @media(max-width: 650px) {
    .products {
      flex-direction: column;
      align-items: center;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Jad Digital</h1>
  <p>اكتشف منتجاتنا الرقمية المميزة، كتب، فيديوهات، ملصقات، وأكثر.</p>
</header>

<section class="products">

  <!-- بطاقة منتج مجاني -->
  <article class="product-card">
    <img src="https://cdn.gumroad.com/res/gumroad/products/ja/thumb.jpg" alt="JA Product Image" />
    <h2 class="product-title">منتج JA المجاني</h2>
    <p class="product-desc">هذا المنتج مجاني 100% ويمكنك تحميله مباشرة عبر Gumroad.</p>
    <a href="https://jaddigital.gumroad.com/l/JA" class="buy-button" target="_blank" rel="noopener">تحميل مجاني</a>
  </article>

</section>

</body>
</html>
